name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install firmware toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi

      - name: Check Python
        run: python -m compileall -q .

      - name: Build firmware images
        run: |
          make -C firmware/buttons
          make -C firmware/exceptions
          make -C firmware/hello-world
          make -C firmware/jump-fldm-loader

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-images
          if-no-files-found: error
          path: |
            firmware/buttons/firmware.*
            firmware/exceptions/firmware.*
            firmware/hello-world/firmware.*
            firmware/jump-fldm-loader/firmware.*
